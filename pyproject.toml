[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "patentes"
version = "0.0.1"
description = "ETL e an\u00e1lise das s\u00e9ries de patentes da OMPI para o artigo do SimpoRI 2026"
authors = [
  { name = "Ailton Manoel Pereira Junior" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["patentes"]
include = ["pyproject.toml", "patentes/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["patentes"]
force-sort-within-sections = true

